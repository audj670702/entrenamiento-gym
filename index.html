<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2f55">
  <meta name="description" content="Portal de acceso a Entrenamiento GYM">
  <title>Entrenamiento GYM</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/entrenamiento-gym-logo-sentadilla.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/entrenamiento-gym-logo-sentadilla.png">
  <style>
    :root {
      --bg: #f5f8fc;
      --panel: #ffffff;
      --text: #10233d;
      --muted: #62748a;
      --line: #dce5ef;
      --blue: #174f82;
      --blue-dark: #0f2f55;
      --shadow: 0 12px 30px rgba(15, 47, 85, 0.10);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      min-height: 58px;
      padding: max(8px, env(safe-area-inset-top)) 16px 8px;
      background: rgba(255, 255, 255, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      min-width: 0;
      gap: 10px;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-name {
      overflow: hidden;
      font-size: 1rem;
      font-weight: 750;
      letter-spacing: 0.01em;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .version {
      margin-left: auto;
      padding-left: 12px;
      color: var(--muted);
      font-size: 0.7rem;
      white-space: nowrap;
    }

    .session-button {
      margin-left: auto;
      padding: 8px 11px;
      color: #ffffff;
      font: inherit;
      font-size: 0.76rem;
      font-weight: 750;
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
      background: var(--blue);
      border: 1px solid var(--blue);
      border-radius: 8px;
    }

    .session-button[data-session-active="true"] {
      color: var(--blue-dark);
      background: #ffffff;
      border-color: var(--line);
    }

    .session-button:focus-visible {
      outline: 3px solid rgba(23, 79, 130, 0.30);
      outline-offset: 2px;
    }

    .version {
      margin-left: 10px;
      padding-left: 0;
    }

    .cvc {
      margin-left: 10px;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    main {
      width: min(100%, 560px);
      margin: 0 auto;
      padding: 28px 16px calc(28px + env(safe-area-inset-bottom));
    }

    .hero-logo {
      display: block;
      width: min(58vw, 245px);
      height: auto;
      margin: 2px auto 24px;
    }

    .training-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      width: 100%;
      min-height: 106px;
      padding: 20px;
      color: inherit;
      text-decoration: none;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transition: transform 140ms ease, border-color 140ms ease, box-shadow 140ms ease;
    }

    .training-card:active {
      transform: scale(0.985);
    }

    .training-card:focus-visible {
      outline: 3px solid rgba(23, 79, 130, 0.30);
      outline-offset: 3px;
    }

    .training-card:hover {
      border-color: rgba(23, 79, 130, 0.42);
      box-shadow: 0 14px 34px rgba(15, 47, 85, 0.14);
    }

    .card-title {
      margin: 0 0 6px;
      color: var(--blue-dark);
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.035em;
      text-transform: uppercase;
    }

    .card-description {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .arrow {
      color: var(--blue);
      font-size: 1.7rem;
      line-height: 1;
    }

    @media (min-width: 640px) {
      main {
        padding-top: 38px;
      }

      .hero-logo {
        margin-bottom: 30px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .training-card {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="./assets/entrenamiento-gym-logo-sentadilla.png" alt="">
      <span class="brand-name">Entrenamiento GYM</span>
    </div>
    <button
      id="sessionButton"
      class="session-button"
      type="button"
      data-session-active="false"
    >Iniciar sesión</button>
    <span class="version" aria-label="Versión 0.1.2">v0.1.2</span>
    <span id="cvc" class="cvc" aria-label="Cadena de validación codificada">Se0Em0Us0En0</span>
  </header>

  <main>
    <img
      class="hero-logo"
      src="./assets/entrenamiento-gym-logo-sentadilla.png"
      alt="Identidad de Entrenamiento GYM"
    >

    <a
      id="cardMiEntrenamiento"
      class="training-card"
      href="https://www.scad.mx/gym-mi-entrenamiento"
      aria-label="Abrir Mi Entrenamiento"
    >
      <div>
        <h1 class="card-title">Mi Entrenamiento</h1>
        <p class="card-description">Consulta tu plan y sesiones</p>
      </div>
      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <script>
    const API_BASE = "https://www.scad.mx/_functions";
    const GYM_ACCESS_URL = "https://www.scad.mx/gym-inicio-sesion";
    const GYM_TRAINING_URL = "https://www.scad.mx/gym-mi-entrenamiento";
    const MEMBER_ID_KEY = "GYM_MEMBER_ID";
    const MEMBER_EMAIL_KEY = "GYM_MEMBER_EMAIL";

    let gymContext = {
      se: false,
      em: false,
      us: false,
      en: false
    };

    function getUrlParam(name) {
      return new URLSearchParams(window.location.search).get(name) || "";
    }

    function resolveGymMember() {
      const urlMemberId =
        getUrlParam("memberId") ||
        getUrlParam("memberID") ||
        getUrlParam("wixMemberId");

      const urlEmail =
        getUrlParam("email") ||
        getUrlParam("correo");

      if (urlMemberId) {
        localStorage.setItem(MEMBER_ID_KEY, urlMemberId);
      }

      if (urlEmail) {
        localStorage.setItem(MEMBER_EMAIL_KEY, urlEmail);
      }

      return {
        memberId: urlMemberId || localStorage.getItem(MEMBER_ID_KEY) || "",
        email: urlEmail || localStorage.getItem(MEMBER_EMAIL_KEY) || ""
      };
    }

    function renderCvc() {
      const value =
        `Se${gymContext.se ? 1 : 0}` +
        `Em${gymContext.em ? 1 : 0}` +
        `Us${gymContext.us ? 1 : 0}` +
        `En${gymContext.en ? 1 : 0}`;

      const element = document.getElementById("cvc");
      if (element) {
        element.textContent = value;
      }
    }

    function renderSessionButton() {
      const button = document.getElementById("sessionButton");
      if (!button) {
        return;
      }

      const sessionActive = gymContext.se === true;
      button.textContent = sessionActive ? "Cerrar sesión" : "Iniciar sesión";
      button.dataset.sessionActive = sessionActive ? "true" : "false";
      button.setAttribute(
        "aria-label",
        sessionActive ? "Cerrar sesión" : "Iniciar sesión"
      );
    }

    function clearGymIdentity() {
      localStorage.removeItem(MEMBER_ID_KEY);
      localStorage.removeItem(MEMBER_EMAIL_KEY);
      gymContext = {
        se: false,
        em: false,
        us: false,
        en: false
      };
    }

    function goToGymAccess(options = {}) {
      const url = new URL(GYM_ACCESS_URL);

      if (options.logout === true) {
        url.searchParams.set("logout", "1");
      }

      window.location.href = url.toString();
    }

    async function loadGymContext() {
      const identity = resolveGymMember();

      if (!identity.memberId) {
        renderCvc();
        renderSessionButton();
        return;
      }

      try {
        const url =
          `${API_BASE}/gymPwaContext` +
          `?memberId=${encodeURIComponent(identity.memberId)}` +
          `&email=${encodeURIComponent(identity.email)}` +
          `&t=${Date.now()}`;

        const response = await fetch(url, { cache: "no-store" });
        const data = await response.json();

        gymContext = {
          se: data?.se === true,
          em: data?.em === true,
          us: data?.us === true,
          en: data?.en === true
        };
      } catch (error) {
        console.error("No fue posible cargar el contexto GYM:", error);
      }

      renderCvc();
      renderSessionButton();
    }

    document.getElementById("sessionButton")?.addEventListener("click", () => {
      if (gymContext.se) {
        clearGymIdentity();
        renderCvc();
        renderSessionButton();
        goToGymAccess({ logout: true });
        return;
      }

      goToGymAccess();
    });

    document.getElementById("cardMiEntrenamiento")?.addEventListener("click", (event) => {
      event.preventDefault();

      if (gymContext.se && gymContext.em && gymContext.us) {
        window.location.href = GYM_TRAINING_URL;
        return;
      }

      goToGymAccess();
    });

    renderSessionButton();
    loadGymContext();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch((error) => {
          console.error("No fue posible registrar la PWA:", error);
        });
      });
    }
  </script>
</body>
</html>
