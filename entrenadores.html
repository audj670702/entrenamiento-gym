<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2f55">
  <title>Entrenadores · GYM</title>
  <style>
:root{--navy:#123a63;--blue:#2473b6;--ink:#172033;--muted:#667085;--line:#dfe6ee;--paper:#fff;--bg:#f3f7fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.topbar{position:sticky;top:0;z-index:20;background:#fffffff2;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}
.topin{width:min(980px,100%);min-height:62px;margin:auto;padding:8px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}.logo{width:42px;height:42px;flex:0 0 auto}
.kicker{font-size:.56rem;letter-spacing:.12em;text-transform:uppercase;color:#7b8794;font-weight:800}
.brand h1{margin:3px 0 0;font-size:1.02rem;line-height:1.1;color:var(--navy)}
.actions{display:flex;align-items:center;gap:8px}.version{font-size:.57rem;color:#98a2b3}
.home{width:37px;height:37px;border:1px solid #cee0f1;border-radius:10px;display:grid;place-items:center;color:#1769aa;background:#f7fbff}
.home svg{width:19px;fill:none;stroke:currentColor;stroke-width:2}
.page{width:min(980px,100%);margin:auto;padding:14px 14px 44px}
.hero{border:1px solid #d9e5ee;background:#fff;border-radius:15px}
.hero-copy{display:flex;align-items:baseline;gap:10px;padding:8px 12px}
.hero h2{flex:0 0 auto;margin:0;font-size:.9rem;color:var(--navy)}
.hero p{margin:0;font-size:.61rem;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{display:grid;gap:7px;margin-top:10px}
.trainer{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:11px;min-height:66px;padding:7px 9px;background:#fff;border:1px solid var(--line);border-left:6px solid #2c9b72;border-radius:10px}
.avatar{display:grid;place-items:center;width:52px;height:52px;overflow:hidden;color:#fff;background:var(--navy);border-radius:9px;font-size:.72rem;font-weight:850}
.avatar img{width:100%;height:100%;object-fit:cover}.copy{min-width:0}
.name{margin:0 0 3px;color:var(--navy);font-size:.76rem;font-weight:850}
.ref{margin:0;color:var(--muted);font-size:.62rem;line-height:1.35}
.link{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:32px;padding:7px 10px;color:#fff;background:var(--navy);border:0;border-radius:8px;font-size:.62rem;font-weight:850;line-height:1;text-decoration:none;white-space:nowrap}
.link:focus-visible,.home:focus-visible{outline:3px solid #73aee0;outline-offset:2px}
.state{padding:28px 14px;color:var(--muted);font-size:.7rem;text-align:center}.state[hidden]{display:none}
@media(max-width:520px){.topin{padding:7px 9px}.logo{width:38px;height:38px}.brand h1{font-size:.9rem}.page{padding:9px 9px 36px}.hero-copy{display:block;padding:7px 9px}.hero h2{font-size:.8rem}.hero p{font-size:.56rem}.trainer{grid-template-columns:46px minmax(0,1fr) auto;gap:8px;padding:7px}.avatar{width:46px;height:46px}.name{font-size:.7rem}.ref{font-size:.58rem}.link{padding:7px 8px;font-size:.58rem}}
</style>
</head>
<body>
  <header class="topbar"><div class="topin"><div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g"><stop stop-color="#173b65"/><stop offset="1" stop-color="#2d73af"/></linearGradient></defs><rect width="64" height="64" rx="16" fill="url(#g)"/><path d="M14 25v14m-5-10v6m10-13v20m31-17v14m5-10v6m-10-13v20M19 32h26" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/></svg><div><div class="kicker">Entrenamiento GYM</div><h1>Entrenadores</h1></div></div><div class="actions"><span class="version">v0.1.52</span><a class="home" href="./" target="_top" aria-label="Inicio"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"/></svg></a></div></div></header>
  <main class="page">
    <section class="hero"><div class="hero-copy"><h2>Conoce a nuestros entrenadores</h2><p>Consulta su referencia y accede a su perfil público.</p></div></section>
    <div id="state" class="state">Cargando entrenadores…</div>
    <section id="list" class="list" aria-label="Entrenadores públicos"></section>
  </main>
  <script>
    const API_URL="https://www.scad.mx/_functions/gymEntrenadoresPublicos";
    function wixImage(value){
      if(!value)return "";
      if(typeof value==="object")return wixImage(value.src||value.url||value.fileUrl||value.imageUrl||"");
      const raw=String(value).trim();
      if(/^https?:\/\//i.test(raw))return raw;
      const m=raw.match(/^wix:image:\/\/v1\/([^/]+)\//i);
      return m?.[1]?("https://static.wixstatic.com/media/"+m[1]):raw;
    }
    function initials(name){
      const p=String(name||"").trim().split(/\s+/).filter(Boolean);
      return p.length?(p[0][0]+(p.length>1?p[p.length-1][0]:"")).toUpperCase():"GY";
    }
    function safeUrl(value){
      try{
        const u=new URL(String(value||"").trim());
        return /^https?:$/.test(u.protocol)?u.toString():"";
      }catch{return ""}
    }
    function render(items){
      const list=document.getElementById("list");
      const state=document.getElementById("state");
      list.replaceChildren();
      if(!items.length){state.textContent="No hay entrenadores publicados.";state.hidden=false;return}
      state.hidden=true;
      items.forEach(item=>{
        const article=document.createElement("article"); article.className="trainer";
        const avatar=document.createElement("div"); avatar.className="avatar";
        const photo=wixImage(item.avatarEntrenador);
        if(photo){const img=document.createElement("img");img.src=photo;img.alt="";img.onerror=()=>{avatar.replaceChildren(document.createTextNode(initials(item.nombre)))};avatar.append(img)}
        else avatar.textContent=initials(item.nombre);
        const copy=document.createElement("div"); copy.className="copy";
        const name=document.createElement("h2"); name.className="name"; name.textContent=String(item.nombre||"Entrenador");
        const ref=document.createElement("p"); ref.className="ref"; ref.textContent=String(item.refEntrenador||"");
        copy.append(name); if(ref.textContent)copy.append(ref);
        article.append(avatar,copy);
        const url=safeUrl(item.referenciaUrl);
        if(url){const a=document.createElement("a");a.className="link";a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.setAttribute("aria-label","Ver perfil de "+name.textContent);a.innerHTML="Ver perfil <span aria-hidden=\"true\">↗</span>";article.append(a)}
        list.append(article);
      });
    }
    fetch(API_URL,{cache:"no-store"})
      .then(async r=>{const d=await r.json();if(!r.ok||d?.ok===false)throw new Error(d?.error||"Error");return Array.isArray(d)?d:(Array.isArray(d?.entrenadores)?d.entrenadores:[])})
      .then(render)
      .catch(()=>{const s=document.getElementById("state");s.textContent="No fue posible cargar los entrenadores.";s.hidden=false});
  </script>
</body>
</html>
