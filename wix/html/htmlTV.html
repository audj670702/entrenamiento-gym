<!DOCTYPE html>
<!-- Panel GYM · #htmlTV · Canal GYM · v0.1.54
     Pegar completo en el componente HTML #htmlTV (sección #seccTV) del Panel GYM.
     Se comunica con el código de página (pages/panel-gym-tv.js) por postMessage. -->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canal GYM</title>
<style>
  :root{--ink:#10233d;--muted:#62748a;--line:#dce5ef;--soft:#f3f7fc;--blue:#174f82;--blue-dark:#0f2f55;--green:#16a34a;--red:#dc2626;--amber:#b45309}
  *{box-sizing:border-box}
  html,body{margin:0;background:#fff;color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{padding:14px;display:grid;gap:14px}
  h2{margin:0;font-size:1rem}
  .muted{color:var(--muted)}
  .card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
  .head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.72rem;font-weight:800;letter-spacing:.04em}
  .badge::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
  .on{background:#dcfce7;color:var(--green)} .off{background:#f1f5f9;color:var(--muted)} .warn{background:#fef3c7;color:var(--amber)}
  .on::before{animation:blink 1.2s ease-in-out infinite} @keyframes blink{50%{opacity:.25}}
  .live{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:12px;align-items:start;margin-top:10px}
  .screen{aspect-ratio:16/9;background:#071a33;border-radius:8px;overflow:hidden;display:grid;place-items:center;color:#cbd5e1}
  .screen iframe{width:100%;height:100%;border:0}
  .now strong{display:block;font-size:.9rem}
  .now small{display:block;margin-top:3px}
  .bar{height:5px;background:#eef3fa;border-radius:9px;margin-top:8px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--blue);width:0}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--blue-dark);padding:7px 12px;font-weight:700;font-size:.8rem}
  button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
  button.danger{color:var(--red)}
  button:disabled{opacity:.5;cursor:wait}
  form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,2fr) 90px auto;gap:8px;align-items:end}
  label{display:grid;gap:3px;font-size:.68rem;font-weight:800;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
  input{font:inherit;font-size:.82rem;padding:8px 10px;border:1px solid var(--line);border-radius:9px;color:var(--ink);background:var(--soft);min-width:0;text-transform:none;letter-spacing:0;font-weight:400}
  input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,79,130,.1)}
  .hint{font-size:.72rem;margin-top:6px;min-height:1em}
  .list{display:grid;gap:6px;margin-top:10px}
  .row{display:grid;grid-template-columns:24px 96px minmax(0,1fr) 62px auto;gap:10px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:10px}
  .row.playing{border-color:var(--blue);box-shadow:0 0 0 2px rgba(23,79,130,.12)}
  .row.inactive{opacity:.55}
  .row img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:#eef3fa;display:block}
  .row .t{font-weight:700;font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .n{color:var(--muted);font-size:.75rem;text-align:center;font-weight:800}
  .row .d{font-variant-numeric:tabular-nums;font-size:.78rem;color:var(--muted)}
  .row .btns{display:flex;gap:4px}
  .row .btns button{padding:5px 8px}
  .empty{padding:18px;text-align:center;color:var(--muted);font-size:.82rem}
  .total{font-size:.75rem}
  .err{color:var(--red)}
  #ytProbe{position:absolute;width:1px;height:1px;left:-9999px;top:0}
  @media (max-width:640px){
    .live{grid-template-columns:1fr}
    form{grid-template-columns:1fr 1fr}
    form .wide{grid-column:1/-1}
    .row{grid-template-columns:20px 72px minmax(0,1fr)}
    .row img{width:72px}
    .row .d{grid-column:3}
    .row .btns{grid-column:1/-1;justify-content:flex-end}
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="head">
      <h2>Canal GYM</h2>
      <span id="estadoBadge" class="badge off">CARGANDO</span>
    </div>
    <div class="live">
      <div id="screen" class="screen">▶</div>
      <div class="now">
        <span class="muted" style="font-size:.68rem;font-weight:800;letter-spacing:.08em">AL AIRE AHORA</span>
        <strong id="nowTitle">—</strong>
        <small id="nowMeta" class="muted"></small>
        <div class="bar"><i id="nowBar"></i></div>
        <div class="actions">
          <button id="btnAire" class="primary" type="button">Poner al aire</button>
          <button id="btnReiniciar" type="button">Reiniciar desde el primer video</button>
        </div>
        <div id="msg" class="hint muted"></div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="head">
      <h2 id="formTitle">Agregar video a la parrilla</h2>
      <span id="total" class="total muted"></span>
    </div>
    <form id="form" autocomplete="off" style="margin-top:10px">
      <label class="wide">URL de YouTube<input id="fUrl" placeholder="https://youtu.be/…" required></label>
      <label class="wide">Título<input id="fTitulo" placeholder="Se completa al pegar la URL"></label>
      <label>Duración<input id="fDur" placeholder="mm:ss" required></label>
      <div style="display:flex;gap:6px">
        <button id="btnGuardar" class="primary" type="submit">Agregar</button>
        <button id="btnCancelar" type="button" hidden>Cancelar</button>
      </div>
    </form>
    <div id="formHint" class="hint muted"></div>
    <div id="lista" class="list"></div>
  </section>
</div>
<div id="ytProbe"><div id="ytProbePlayer"></div></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let estado = null, editId = null, seq = 0, recibidoEn = 0, previewKey = '';
  const pendientes = new Map();

  // ---------- puente con el código de página ----------
  function llamar(accion, payload, espera = 20000) {
    const id = ++seq;
    return new Promise((resolve, reject) => {
      pendientes.set(id, { resolve, reject });
      window.parent.postMessage({ origen: 'gymTvPanel', id, accion, payload }, '*');
      setTimeout(() => { if (pendientes.has(id)) { pendientes.delete(id); reject(new Error('Sin respuesta del panel.')); } }, espera);
    });
  }

  // El componente HTML puede cargar antes que el código de página ($w.onReady):
  // se reintenta la primera consulta hasta que la página responda.
  async function arrancar(intento = 0) {
    try { pintar(await llamar('estado', {}, 1500)); }
    catch (e) {
      if (intento < 20) return arrancar(intento + 1);
      aviso('El panel no responde. Revisa el código de la página (#htmlTV).', true);
    }
  }
  window.addEventListener('message', (ev) => {
    const m = ev.data || {};
    if (m.origen !== 'gymTvVelo' || !pendientes.has(m.id)) return;
    const p = pendientes.get(m.id); pendientes.delete(m.id);
    m.ok ? p.resolve(m.data) : p.reject(new Error(m.error || 'Error'));
  });

  async function ejecutar(accion, payload, boton) {
    if (boton) boton.disabled = true;
    try { pintar(await llamar(accion, payload)); return true; }
    catch (e) { aviso(e.message, true); return false; }
    finally { if (boton) boton.disabled = false; }
  }

  // ---------- utilidades ----------
  const esc = (v = '') => String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function ytId(v) {
    const raw = String(v || '').trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(raw)) return raw;
    const m = raw.match(/(?:youtu\.be\/|[?&]v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : '';
  }
  function fmt(s) {
    s = Math.max(0, Math.floor(Number(s) || 0));
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }
  function parseDur(v) {
    const t = String(v || '').trim();
    if (/^\d+$/.test(t)) return Number(t);
    const p = t.split(':').map(Number);
    if (p.some(n => !Number.isFinite(n))) return 0;
    return p.reduce((a, n) => a * 60 + n, 0);
  }
  function aviso(texto, error) { const el = $('msg'); el.textContent = texto || ''; el.className = 'hint ' + (error ? 'err' : 'muted'); }

  // ---------- pintar ----------
  function pintar(data) {
    if (!data) return;
    estado = data; recibidoEn = Date.now();
    const alAire = data.canal?.alAire === true, tx = data.transmision || {};
    const badge = $('estadoBadge');
    if (!alAire) { badge.className = 'badge off'; badge.textContent = 'FUERA DEL AIRE'; }
    else if (tx.modo === 'PARRILLA') { badge.className = 'badge on'; badge.textContent = 'AL AIRE'; }
    else { badge.className = 'badge warn'; badge.textContent = 'AL AIRE · SIN VIDEOS ACTIVOS'; }
    $('btnAire').textContent = alAire ? 'Sacar del aire' : 'Poner al aire';
    $('btnAire').className = alAire ? 'danger' : 'primary';
    $('btnReiniciar').hidden = !alAire;
    aviso('');

    const lista = data.parrilla || [];
    const activos = lista.filter(v => v.activo);
    $('total').textContent = lista.length
      ? `${activos.length} de ${lista.length} activos · ciclo ${fmt(activos.reduce((s, v) => s + v.duracionSegundos, 0))}`
      : '';
    $('lista').innerHTML = lista.length ? lista.map((v, i) => `
      <div class="row${v.activo ? '' : ' inactive'}${tx.videoId === v._id ? ' playing' : ''}">
        <span class="n">${i + 1}</span>
        <img src="${esc(v.miniaturaUrl)}" alt="">
        <span class="t" title="${esc(v.titulo)}">${tx.videoId === v._id ? '▶ ' : ''}${esc(v.titulo || v.youtubeId)}</span>
        <span class="d">${fmt(v.duracionSegundos)}</span>
        <span class="btns">
          <button type="button" data-a="subir" data-id="${v._id}" ${i === 0 ? 'disabled' : ''} title="Subir">↑</button>
          <button type="button" data-a="bajar" data-id="${v._id}" ${i === lista.length - 1 ? 'disabled' : ''} title="Bajar">↓</button>
          <button type="button" data-a="activo" data-id="${v._id}">${v.activo ? 'Pausar' : 'Activar'}</button>
          <button type="button" data-a="editar" data-id="${v._id}">Editar</button>
          <button type="button" class="danger" data-a="eliminar" data-id="${v._id}" title="Eliminar">✕</button>
        </span>
      </div>`).join('') : '<div class="empty">La parrilla está vacía. Agrega el primer video.</div>';
    pintarAhora();
  }

  function pintarAhora() {
    const tx = estado?.transmision || {};
    const transcurrido = Math.floor((Date.now() - recibidoEn) / 1000);
    if (tx.modo !== 'PARRILLA') {
      $('nowTitle').textContent = estado?.canal?.alAire ? 'Sin videos activos en la parrilla' : 'El canal está fuera del aire';
      $('nowMeta').textContent = '';
      $('nowBar').style.width = '0';
      setPreview('');
      return;
    }
    const pos = Math.min(tx.duracionSegundos, tx.segundoInicio + transcurrido);
    $('nowTitle').textContent = tx.titulo || tx.youtubeId;
    $('nowMeta').textContent = `Video ${tx.posicion} de ${tx.totalVideos} · ${fmt(pos)} / ${fmt(tx.duracionSegundos)}`;
    $('nowBar').style.width = (100 * pos / tx.duracionSegundos).toFixed(1) + '%';
    setPreview(tx.youtubeId, tx.segundoInicio);
    if (pos >= tx.duracionSegundos) refrescar();
  }

  function setPreview(id, start) {
    const key = id || '';
    if (key === previewKey) return;
    previewKey = key;
    $('screen').innerHTML = id
      ? `<iframe src="https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&mute=1&controls=0&playsinline=1&start=${Math.floor(start || 0)}" allow="autoplay; encrypted-media" title="Vista previa"></iframe>`
      : '▶';
  }

  // ---------- formulario ----------
  function limpiarForm() {
    editId = null; $('form').reset();
    $('formTitle').textContent = 'Agregar video a la parrilla';
    $('btnGuardar').textContent = 'Agregar';
    $('btnCancelar').hidden = true; $('formHint').textContent = '';
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const youtubeId = ytId($('fUrl').value);
    const duracionSegundos = parseDur($('fDur').value);
    if (!youtubeId) { $('formHint').textContent = 'URL de YouTube no válida.'; return; }
    if (duracionSegundos <= 0) { $('formHint').textContent = 'Indica la duración (mm:ss).'; return; }
    const actual = editId ? (estado?.parrilla || []).find(v => v._id === editId) : null;
    const ok = await ejecutar('guardarVideo', {
      _id: editId || undefined,
      youtubeUrl: $('fUrl').value.trim(),
      youtubeId,
      titulo: $('fTitulo').value.trim(),
      duracionSegundos,
      activo: actual ? actual.activo : true
    }, $('btnGuardar'));
    if (ok) limpiarForm();
  });
  $('btnCancelar').addEventListener('click', limpiarForm);

  $('lista').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    const id = b.dataset.id, v = (estado?.parrilla || []).find(x => x._id === id);
    switch (b.dataset.a) {
      case 'subir': return ejecutar('moverVideo', { id, direccion: -1 }, b);
      case 'bajar': return ejecutar('moverVideo', { id, direccion: 1 }, b);
      case 'activo': return ejecutar('cambiarActivo', { id, activo: !v?.activo }, b);
      case 'eliminar': if (confirm(`¿Eliminar "${v?.titulo || v?.youtubeId}" de la parrilla?`)) ejecutar('eliminarVideo', { id }, b); return;
      case 'editar':
        if (!v) return;
        editId = id;
        $('fUrl').value = v.youtubeUrl || ('https://youtu.be/' + v.youtubeId);
        $('fTitulo').value = v.titulo || '';
        $('fDur').value = fmt(v.duracionSegundos);
        $('formTitle').textContent = 'Editar video';
        $('btnGuardar').textContent = 'Guardar';
        $('btnCancelar').hidden = false;
        $('fUrl').focus();
    }
  });

  $('btnAire').addEventListener('click', (e) => {
    const alAire = estado?.canal?.alAire === true;
    if (alAire && !confirm('¿Sacar el Canal GYM del aire? Los usuarios verán el monitor en espera.')) return;
    ejecutar('alAire', { alAire: !alAire }, e.currentTarget);
  });
  $('btnReiniciar').addEventListener('click', (e) => {
    if (confirm('¿Reiniciar la emisión desde el primer video?')) ejecutar('reiniciar', {}, e.currentTarget);
  });

  // ---------- duración y título automáticos (YouTube IFrame API) ----------
  let probe = null, probeListo = false, probeId = '';
  window.onYouTubeIframeAPIReady = () => {
    probe = new YT.Player('ytProbePlayer', {
      width: 1, height: 1,
      playerVars: { playsinline: 1, mute: 1 },
      events: {
        onReady: () => { probeListo = true; if (probeId) probe.cueVideoById(probeId); },
        onStateChange: leerProbe
      }
    });
  };
  function leerProbe() {
    if (!probe || !probeId) return;
    const d = Math.floor(probe.getDuration?.() || 0);
    const t = probe.getVideoData?.().title || '';
    if (d > 0 && !$('fDur').value) $('fDur').value = fmt(d);
    if (t && !$('fTitulo').value) $('fTitulo').value = t;
    if (d > 0) $('formHint').textContent = 'Duración y título tomados de YouTube.';
    else if (probe.getPlayerState?.() === YT.PlayerState.CUED) {
      // Algunos videos sólo informan la duración al reproducir: un instante en silencio.
      probe.mute(); probe.playVideo(); setTimeout(() => { probe.pauseVideo(); leerProbe(); }, 1200);
    }
  }
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);

  $('fUrl').addEventListener('input', () => {
    const id = ytId($('fUrl').value);
    if (!id || id === probeId) return;
    probeId = id;
    if (!editId) { $('fDur').value = ''; $('fTitulo').value = ''; }
    $('formHint').textContent = 'Leyendo datos del video…';
    if (probeListo) probe.cueVideoById(id);
  });

  // ---------- ciclo ----------
  let refrescando = false;
  async function refrescar() {
    if (refrescando) return;
    refrescando = true;
    try { pintar(await llamar('estado')); } catch (e) { aviso(e.message, true); }
    finally { refrescando = false; }
  }
  setInterval(pintarAhora, 1000);
  setInterval(() => { if (estado) refrescar(); }, 15000);
  arrancar();
})();
</script>
</body>
</html>
