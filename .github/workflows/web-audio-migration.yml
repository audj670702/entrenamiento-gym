name: Web Audio Migration

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

permissions:
  contents: write

jobs:
  migrate:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply migration
        run: python scripts/migrate_web_audio.py
      - name: Commit migration
        run: |
          git config user.name "SCaD"
          git config user.email "gestor.isp@gmail.com"
          git add index.html
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No migration needed"
            exit 0
          fi
          git commit -m "Migrate app sound effects to Web Audio"
          git push
