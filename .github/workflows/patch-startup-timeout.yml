name: Patch GYM startup timeout

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")

          a = '<span class="version" aria-label="Versión 0.1.43">v0.1.43</span>'
          b = '<span class="version" aria-label="Versión 0.1.44">v0.1.44</span>'
          assert s.count(a) == 1
          s = s.replace(a, b, 1)

          a = '        const response = await fetch(url, { cache: "no-store" });\n        const data = await response.json();'
          b = '''        const controller = new AbortController();
        const timeoutId = window.setTimeout(() => controller.abort(), 7000);
        let response;
        let data;

        try {
          response = await fetch(url, {
            cache: "no-store",
            signal: controller.signal
          });
          data = await response.json();
        } finally {
          window.clearTimeout(timeoutId);
        }'''
          assert s.count(a) == 1
          s = s.replace(a, b, 1)

          a = '    loadGymContext().finally(closeSplashScreen);'
          b = '''    const splashSafetyTimer = window.setTimeout(closeSplashScreen, 4500);
    loadGymContext().finally(() => {
      window.clearTimeout(splashSafetyTimer);
      closeSplashScreen();
    });'''
          assert s.count(a) == 1
          s = s.replace(a, b, 1)

          p.write_text(s, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          rm -f .github/workflows/patch-startup-timeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/patch-startup-timeout.yml
          git commit -m "fix: prevent GYM splash from blocking on API"
          git push
